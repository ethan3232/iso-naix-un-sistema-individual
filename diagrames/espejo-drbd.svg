<rect x="121.5" y="505.5" width="6" height="73" rx="3" fill="#0891b2"/>
<text x="303.0" y="538.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Disco virtual de 1 GB</text>
<text x="303.0" y="554.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">disco local de cada servidor</text>
<rect x="880" y="220" width="440" height="400" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" stroke-dasharray="8 5"/>
