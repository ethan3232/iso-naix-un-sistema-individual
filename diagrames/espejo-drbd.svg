<text x="1100" y="263" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#fdf2f8" text-anchor="middle">SECUNDARIO · en el diseño, VM en PMX3 (SIMULADO)</text>
<rect x="920" y="296" width="360" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="921.5" y="297.5" width="6" height="73" rx="3" fill="#94a3b8"/>
<text x="1103.0" y="330.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">/srv/espejo</text>
<text x="1103.0" y="346.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">sin montar: solo recibe copias</text>
