<rect width="1400" height="780" fill="#ffffff"/>
<text x="700.0" y="40" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Espejo por red (RAID 1 entre dos equipos) con DRBD</text>
<text x="700.0" y="64" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">Recurso r0 · cada escritura se guarda en los dos servidores antes de darse por terminada</text>
<rect x="560" y="92" width="280" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<rect x="561.5" y="93.5" width="6" height="67" rx="3" fill="#64748b"/>
<text x="703.0" y="123.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Usuarios / servicio</text>
<text x="703.0" y="139.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">leen y escriben en /srv/espejo</text>
<path d="M700,162 L700,180 L300,180 L300,232" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#flecha)"/>
<text x="310" y="205" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">solo el PRIMARIO tiene el disco montado</text>
<rect x="80" y="220" width="440" height="400" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" stroke-dasharray="8 5"/>
