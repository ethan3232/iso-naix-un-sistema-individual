<rect x="920" y="400" width="360" height="76" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="3"/>
<rect x="921.5" y="401.5" width="6" height="73" rx="3" fill="#be185d"/>
<text x="1103.0" y="434.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">/dev/drbd0</text>
<text x="1103.0" y="450.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">dispositivo DRBD · recurso r0</text>
<path d="M1100,476 L1100,504" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#flecha)"/>
<rect x="920" y="504" width="360" height="76" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
<rect x="921.5" y="505.5" width="6" height="73" rx="3" fill="#0891b2"/>
<text x="1103.0" y="538.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Disco virtual de 1 GB</text>
<text x="1103.0" y="554.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">disco local de cada servidor</text>
<path d="M520,425 L878,425" fill="none" stroke="#be185d" stroke-width="4" stroke-linejoin="round" marker-end="url(#flecha-drbd)"/>
<path d="M878,452 L522,452" fill="none" stroke="#be185d" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#flecha-drbd)"/>
<rect x="610.0" y="392" width="180" height="24" rx="12" fill="#ffffff" stroke="#be185d" stroke-width="1.3"/>
<text x="700" y="408.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#be185d" text-anchor="middle">LAN23 · TCP 7789</text>
<text x="700" y="474" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#be185d" text-anchor="middle">confirmación (ACK)</text>
<rect x="540" y="498" width="320" height="112" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.2"/>
<text x="700" y="520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#be185d" text-anchor="middle">Protocolo C (síncrono)</text>
<text x="560" y="542" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">1  SRV2 escribe en su disco</text>
<text x="560" y="561" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">2  envía el bloque a SRV3</text>
<text x="560" y="580" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">3  SRV3 lo escribe y confirma</text>
<text x="560" y="599" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">4  solo entonces se da por escrito</text>
<rect x="80" y="650" width="1240" height="90" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="100" y="676" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ea580c" text-anchor="start">Si cae SRV2 (probado con un apagado brusco):</text>
<text x="100" y="700" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">en SRV3 →  drbdadm primary r0  +  mount /dev/drbd0 /srv/espejo   →   servicio de nuevo en ~13 s, sin perder datos (RPO = 0)</text>
<text x="100" y="722" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Al volver SRV2 se resincroniza solo. Sincronización inicial de 1 GB: 53 s.</text>
<rect x="80" y="754" width="16" height="16" rx="4" fill="#be185d"/>
<text x="104" y="766" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">replicación DRBD</text>
<rect x="251.6" y="751" width="40" height="22" rx="5" fill="#fff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="299.6" y="766" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">SIMULADO: VM de VirtualBox en LAN23; en el diseño, dentro del clúster</text>
</svg>