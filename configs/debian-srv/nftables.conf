#!/usr/sbin/nft -f
# Servidor de comunicaciones Debian 13 (deb-srv · DEB13-SRV) — 192.168.23.3
# WAN: enp0s3 (NAT VirtualBox, DHCP) · LAN: enp0s8 (LAN23 192.168.23.0/24)
# Vuelta atrás: sudo cp /root/backups/nftables.conf.orig /etc/nftables.conf && sudo nft -f /etc/nftables.conf

flush ruleset

define WAN = "enp0s3"
define LAN = "enp0s8"
define RED_LAN = 192.168.23.0/24

table inet filtro {
    # Tráfico dirigido al propio servidor
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept
        iifname $LAN ip saddr $RED_LAN accept comment "Gestion desde LAN23"
        iifname $WAN ip saddr 10.0.2.2 tcp dport 22 accept comment "SSH desde el host (NAT VirtualBox)"
        log prefix "IN-DROP " drop
    }

    # Tráfico que atraviesa el servidor (LAN <-> Internet)
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname $LAN tcp dport 23 log prefix "BLOQUEADO-TELNET " drop comment "PRUEBA BLOQUEADA: Telnet"
        iifname $LAN tcp dport 443 ct state new log prefix "PERMITIDO-HTTPS " accept comment "PRUEBA PERMITIDA: HTTPS"
        iifname $LAN oifname $WAN accept comment "LAN23 -> Internet"
        log prefix "FWD-DROP " drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# NAT: la LAN sale a Internet con la IP de la WAN
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN masquerade
    }
}
