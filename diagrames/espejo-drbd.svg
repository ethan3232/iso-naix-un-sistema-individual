<rect x="80" y="250" width="440" height="22" rx="0" fill="#db2777"/>
<text x="300" y="244" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">DEB13-SRV2 · .21</text>
<text x="300" y="263" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#fdf2f8" text-anchor="middle">PRIMARIO · en el diseño, VM en PMX1 (SIMULADO)</text>
